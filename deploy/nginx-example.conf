# Example ONLY: replace game.example.com and certificate paths.
# If BaoTa already manages this domain, integrate proxy locations into its
# existing HTTPS virtual host rather than creating a duplicate 443 server.
server {
    listen 80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Enable HSTS only after testing HTTPS and all required subdomains.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;  # SSE heartbeat every 15s
        proxy_buffering off;     # essential for low-latency SSE
        proxy_cache off;
        gzip off;
    }
}
